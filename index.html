<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meena Bazaar 3F</title>
<style>
body{margin:0;font-family:Arial;background:#f3f4f6;color:#111}
header{background:#2563eb;color:white;text-align:center;padding:20px}
.container{max-width:700px;margin:auto;padding:15px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}
button{padding:12px 18px;border:0;border-radius:9px;margin:5px;cursor:pointer}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.dark{background:#111827;color:white}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0002}
.price{font-size:20px;font-weight:bold;color:#2563eb}
.hidden{display:none}
.categories{display:flex;overflow:auto;gap:5px}
</style>
</head>

<body>

<header>
<h1>🛍️ Meena Bazaar 3F</h1>
<p>پرانے اور استعمال شدہ اشیاء کی خرید و فروخت</p>

<button class="blue" onclick="login()">👤 Login</button>
<button class="dark" onclick="showForm()">＋ اشتہار لگائیں</button>
</header>

<div class="container">

<input id="search" placeholder="🔍 چیز تلاش کریں..." oninput="loadAds()">

<div class="categories">
<button onclick="setCategory('تمام')">تمام</button>
<button onclick="setCategory('موبائل')">📱 موبائل</button>
<button onclick="setCategory('گاڑی')">🚗 گاڑی</button>
<button onclick="setCategory('فرنیچر')">🛋️ فرنیچر</button>
<button onclick="setCategory('الیکٹرانکس')">💻 الیکٹرانکس</button>
<button onclick="setCategory('دیگر')">📦 دیگر</button>
</div>

<div id="form" class="hidden">
<h2>نیا اشتہار</h2>

<input id="title" placeholder="چیز کا نام">
<input id="price" type="number" placeholder="قیمت">
<input id="city" placeholder="شہر">

<select id="category">
<option>موبائل</option>
<option>گاڑی</option>
<option>فرنیچر</option>
<option>الیکٹرانکس</option>
<option>دیگر</option>
</select>

<textarea id="description" placeholder="چیز کی تفصیل"></textarea>
<input id="phone" placeholder="موبائل نمبر">

<button class="blue" onclick="addAd()">اشتہار محفوظ کریں</button>
</div>

<h2>تازہ اشتہارات</h2>
<div id="ads">لوڈ ہو رہا ہے...</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
apiKey:"AIzaSyA-E7avzWjS9WLRMq6cgR2XA0f3urfsd4Q",
authDomain:"meena-bazaar-3f.firebaseapp.com",
projectId:"meena-bazaar-3f",
storageBucket:"meena-bazaar-3f.firebasestorage.app",
messagingSenderId:"95538058106",
appId:"1:95538058106:web:c42bf08d9d092b3382fcc3"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let category="تمام";
let currentUser=null;


onAuthStateChanged(auth,user=>{
currentUser=user;

if(user){
alert("Login کامیاب ہوگیا!");
}

loadAds();
});


window.login=async function(){

const email=prompt("اپنا Email لکھیں:");
if(!email)return;

const password=prompt("اپنا Password لکھیں:");
if(!password)return;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

alert("Login نہیں ہوا: "+error.message);

}

};


window.showForm=function(){

if(!currentUser){

alert("پہلے Login کریں، پھر اشتہار لگائیں۔");
return;

}

document.getElementById("form").classList.remove("hidden");

};


window.setCategory=function(c){

category=c;
loadAds();

};


window.addAd=async function(){

if(!currentUser){

alert("پہلے Login کریں۔");
return;

}

const title=document.getElementById("title").value.trim();
const price=document.getElementById("price").value;
const city=document.getElementById("city").value.trim();
const cat=document.getElementById("category").value;
const description=document.getElementById("description").value.trim();
const phone=document.getElementById("phone").value.trim();

if(!title||!price||!city||!phone){

alert("نام، قیمت، شہر اور موبائل نمبر لازمی ہیں۔");
return;

}

try{

await addDoc(collection(db,"ads"),{

title:title,
price:Number(price),
city:city,
category:cat,
description:description,
phone:phone,

/* ابھی testing کے لیے true */
approved:true,

featured:false,
userId:currentUser.uid,
createdAt:serverTimestamp()

});

alert("🎉 اشتہار کامیابی سے محفوظ ہوگیا!");

document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("description").value="";
document.getElementById("phone").value="";

document.getElementById("form").classList.add("hidden");

loadAds();

}catch(error){

alert("اشتہار محفوظ نہیں ہوا: "+error.message);

}

};


window.loadAds=async function(){

const box=document.getElementById("ads");

try{

const snapshot=await getDocs(collection(db,"ads"));

const search=
document.getElementById("search").value.toLowerCase();

box.innerHTML="";

let count=0;

snapshot.forEach(doc=>{

const ad=doc.data();

const text=
(ad.title||"")+" "+
(ad.city||"")+" "+
(ad.description||"");

const matchSearch=
text.toLowerCase().includes(search);

const matchCategory=
category==="تمام"||ad.category===category;

if(ad.approved===true&&matchSearch&&matchCategory){

count++;

const wa=
"https://wa.me/92"+
(ad.phone||"").replace(/^0/,"");

box.innerHTML+=`

<div class="card">

<h3>${safe(ad.title)}</h3>

<div class="price">
Rs. ${Number(ad.price).toLocaleString()}
</div>

<p>📍 ${safe(ad.city)}</p>

<p>${safe(ad.description||"")}</p>

<div>

<a href="tel:${ad.phone}">
<button class="blue">📞 Call</button>
</a>

<a href="${wa}" target="_blank">
<button class="green">💬 WhatsApp</button>
</a>

</div>

</div>

`;

}

});

if(count===0){

box.innerHTML="<p>ابھی کوئی اشتہار موجود نہیں۔</p>";

}

}catch(error){

console.log(error);

box.innerHTML=
"<p>اشتہارات لوڈ نہیں ہو سکے۔</p>";

}

};


function safe(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

loadAds();

</script>

</body>
</html>
