<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meena Bazaar 3F</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f1f5f9;
color:#111827
}

header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:22px 15px;
text-align:center
}

h1{margin:0 0 8px}

.container{
max-width:1000px;
margin:auto;
padding:15px
}

.card{
background:#fff;
border-radius:15px;
padding:16px;
margin:15px 0;
box-shadow:0 3px 12px #00000012
}

input,textarea,select{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:15px
}

textarea{min-height:90px}

button{
border:0;
border-radius:9px;
padding:11px 15px;
margin:4px;
cursor:pointer;
font-size:14px
}

.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.dark{background:#111827;color:#fff}
.orange{background:#ea580c;color:#fff}
.gray{background:#e5e7eb;color:#111827}

.hidden{display:none!important}
.center{text-align:center}

.row{
display:flex;
flex-wrap:wrap;
gap:4px
}

.row>*{
flex:1;
min-width:120px
}

.cats{
display:flex;
gap:5px;
overflow:auto
}

.cats button{
white-space:nowrap
}

.ad-img{
width:100%;
max-height:360px;
object-fit:cover;
border-radius:12px
}

.price{
font-size:22px;
font-weight:bold;
color:#2563eb
}

.featured{
border:3px solid #f59e0b
}

.sold{
opacity:.78;
border:3px solid #dc2626
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:20px;
color:#fff;
margin-bottom:8px
}

.b-featured{background:#f59e0b}
.b-sold{background:#dc2626}

.small{
font-size:13px;
color:#64748b
}

.chat{
max-height:400px;
overflow:auto;
background:#f8fafc;
padding:10px;
border-radius:12px
}

.msg{
padding:9px 12px;
margin:6px 0;
border-radius:12px;
max-width:82%;
background:#e5e7eb
}

.mine{
margin-right:auto;
background:#dbeafe
}

.theirs{
margin-left:auto
}

.stat{
display:inline-block;
padding:10px;
background:#f8fafc;
border-radius:10px;
margin:4px
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px
}

.gallery img{
width:100%;
height:170px;
object-fit:cover;
border-radius:10px
}

@media(min-width:700px){
.gallery{
grid-template-columns:repeat(3,1fr)
}
}
</style>
</head>

<body>

<header>

<h1>🛍️ Meena Bazaar 3F</h1>

<p>خرید و فروخت کا آسان آن لائن بازار</p>

<div id="authButtons">

<button class="blue" onclick="login()">
👤 Login
</button>

<button class="gray" onclick="registerUser()">
➕ نیا اکاؤنٹ
</button>

</div>

<div id="userArea" class="hidden">

<span id="userEmail"></span>

<button class="gray" onclick="logout()">
Logout
</button>

</div>

<div id="adminButton" class="hidden">

<button class="orange" onclick="openAdmin()">
🛡️ Admin Panel
</button>

</div>

</header>


<div class="container">


<!-- SEARCH -->

<div class="card">

<input
id="search"
placeholder="🔍 چیز، شہر یا تفصیل تلاش کریں..."
oninput="loadAds()"
>

<div class="cats">

<button class="gray"
onclick="setCategory('تمام')">
تمام
</button>

<button class="gray"
onclick="setCategory('موبائل')">
📱 موبائل
</button>

<button class="gray"
onclick="setCategory('گاڑی')">
🚗 گاڑی
</button>

<button class="gray"
onclick="setCategory('فرنیچر')">
🛋️ فرنیچر
</button>

<button class="gray"
onclick="setCategory('الیکٹرانکس')">
💻 الیکٹرانکس
</button>

<button class="gray"
onclick="setCategory('کپڑے')">
👕 کپڑے
</button>

<button class="gray"
onclick="setCategory('مکان')">
🏠 مکان
</button>

<button class="gray"
onclick="setCategory('دیگر')">
📦 دیگر
</button>

</div>

</div>


<div class="center">

<button
class="blue"
onclick="showAdForm()">
＋ اپنا اشتہار لگائیں
</button>

</div>


<!-- ADD AD -->

<div
id="adForm"
class="card hidden"
>

<h2>📢 نیا اشتہار</h2>

<p class="small">
فی الحال تمام اشتہارات مفت ہیں۔
</p>

<input
id="title"
placeholder="چیز کا نام *"
>

<input
id="price"
type="number"
min="0"
placeholder="قیمت *"
>

<input
id="city"
placeholder="شہر *"
>

<select id="category">

<option>موبائل</option>
<option>گاڑی</option>
<option>فرنیچر</option>
<option>الیکٹرانکس</option>
<option>کپڑے</option>
<option>مکان</option>
<option>دیگر</option>

</select>

<textarea
id="description"
placeholder="مکمل تفصیل *">
</textarea>

<input
id="phone"
placeholder="موبائل / WhatsApp نمبر *"
>

<textarea
id="imageUrls"
placeholder="تصویر کے URL لکھیں، ایک URL فی لائن">
</textarea>

<select id="plan">

<option value="free">
Free — Rs. 0
</option>

<option value="featured">
Featured — ابھی Free
</option>

</select>

<button
class="blue"
onclick="addAd()">
📢 Publish
</button>

<button
class="gray"
onclick="hideAdForm()">
Cancel
</button>

</div>


<h2>🔥 تازہ اشتہارات</h2>

<div id="ads">
لوڈ ہو رہا ہے...
</div>


<!-- CHAT -->

<div
id="chatPanel"
class="card hidden"
>

<h2 id="chatTitle">
💬 Chat
</h2>

<div
id="chatMessages"
class="chat">
Loading...
</div>

<textarea
id="chatInput"
placeholder="پیغام لکھیں...">
</textarea>

<div class="row">

<button
class="blue"
onclick="sendMessage()">
📤 Send
</button>

<button
class="gray"
onclick="closeChat()">
بند کریں
</button>

</div>

</div>


<!-- ADMIN -->

<div
id="adminPanel"
class="card hidden"
>

<h2>
🛡️ Admin Panel
</h2>

<p>
Admin:
<strong>
muslimabdulwajid51@gmail.com
</strong>
</p>

<div id="adminStats"></div>

<div id="adminAds"></div>

</div>

</div>


<script type="module">


/* FIREBASE */

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import{
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
setDoc,
updateDoc,
deleteDoc,
onSnapshot,
query,
orderBy,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import{
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* CONFIG */

const firebaseConfig={

apiKey:
"AIzaSyA-E7avzWjS9WLRMq6cgR2XA0f3urfsd4Q",

authDomain:
"meena-bazaar-3f.firebaseapp.com",

projectId:
"meena-bazaar-3f",

storageBucket:
"meena-bazaar-3f.firebasestorage.app",

messagingSenderId:
"95538058106",

appId:
"1:95538058106:web:c42bf08d9d092b3382fcc3"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);


const ADMIN=
"muslimabdulwajid51@gmail.com";


let user=null;

let cat="تمام";

let activeChat=null;

let unsub=null;


const $=
id=>document.getElementById(id);


const esc=
v=>
String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");


function admin(){

return !!(
user?.email &&
user.email.toLowerCase()
===
ADMIN.toLowerCase()
);

}


function wa(phone){

let n=
String(phone||"")
.replace(/\D/g,"");

if(n.startsWith("0"))
n=n.slice(1);

if(!n.startsWith("92"))
n="92"+n;

return "https://wa.me/"+n;

}


/* AUTH */

onAuthStateChanged(
auth,
u=>{

user=u;

$("authButtons")
.classList
.toggle("hidden",!!u);

$("userArea")
.classList
.toggle("hidden",!u);

$("adminButton")
.classList
.toggle("hidden",!admin());

if(u)
$("userEmail").textContent=
u.email;

loadAds();

});


/* LOGIN */

window.login=
async()=>{

const e=
prompt("Email:");

if(!e)
return;

const p=
prompt("Password:");

if(!p)
return;

try{

await signInWithEmailAndPassword(
auth,e,p
);

alert("✅ Login کامیاب");

}catch(x){

alert(
"❌ "+x.message
);

}

};


/* REGISTER */

window.registerUser=
async()=>{

const e=
prompt("نیا Email:");

if(!e)
return;

const p=
prompt(
"Password (کم از کم 6 حروف):"
);

if(!p)
return;

try{

await createUserWithEmailAndPassword(
auth,e,p
);

alert(
"🎉 Account بن گیا"
);

}catch(x){

alert(
"❌ "+x.message
);

}

};


/* LOGOUT */

window.logout=
()=>signOut(auth);


/* CATEGORY */

window.setCategory=
c=>{

cat=c;

loadAds();

};


/* FORM */

window.showAdForm=
()=>{

if(!user){

alert(
"پہلے Login کریں"
);

return;

}

$("adForm")
.classList
.remove("hidden");

};


window.hideAdForm=
()=>
$("adForm")
.classList
.add("hidden");


/* ADD AD */

window.addAd=
async()=>{

if(!user){

alert(
"پہلے Login کریں"
);

return;

}


const title=
$("title").value.trim();

const price=
$("price").value;

const city=
$("city").value.trim();

const category=
$("category").value;

const description=
$("description").value.trim();

const phone=
$("phone").value.trim();

const plan=
$("plan").value;


const images=
$("imageUrls")
.value
.split(/\n|,/)
.map(x=>x.trim())
.filter(Boolean)
.slice(0,10);


if(
!title ||
price==="" ||
!city ||
!description ||
!phone
){

alert(
"نام، قیمت، شہر، تفصیل اور نمبر لازمی ہیں"
);

return;

}


try{

await addDoc(
collection(db,"ads"),
{

title,

price:Number(price),

city,

category,

description,

phone,

images,

userId:user.uid,

userEmail:user.email,

featured:
plan==="featured",

plan,

paymentStatus:
"free",

approved:true,

rejected:false,

sold:false,

createdAt:
serverTimestamp()

}
);


alert(
"🎉 اشتہار Publish ہوگیا"
);


[
"title",
"price",
"city",
"description",
"phone",
"imageUrls"
]
.forEach(
id=>
$(id).value=""
);


hideAdForm();

loadAds();


}catch(x){

alert(
"❌ "+x.message
);

}

};


/* LOAD ADS */

window.loadAds=
async()=>{

const box=
$("ads");

box.innerHTML=
"لوڈ ہو رہا ہے...";


try{

const s=
await getDocs(
collection(db,"ads")
);


const term=
$("search")
.value
.toLowerCase()
.trim();


let ads=[];


s.forEach(
d=>{

const x=d.data();


if(
x.approved===true &&
!x.rejected
){

const hay=
(
(x.title||"")+
" "+
(x.city||"")+
" "+
(x.category||"")+
" "+
(x.description||"")
)
.toLowerCase();


if(
(!term ||
hay.includes(term))
&&
(cat==="تمام" ||
x.category===cat)
){

ads.push({
id:d.id,
...x
});

}

}

});


ads.sort(
(a,b)=>
Number(b.featured)-
Number(a.featured)
);


if(!ads.length){

box.innerHTML=
`
<div class="card center">
📭 ابھی کوئی اشتہار نہیں
</div>
`;

return;

}


box.innerHTML="";


ads.forEach(
x=>{

const mine=
user &&
x.userId===user.uid;

const sold=
!!x.sold;


const imgs=
(x.images||[])
.map(
i=>
`
<img
src="${esc(i)}"
onerror="this.style.display='none'"
>
`
)
.join("");


box.innerHTML+=
`

<div
class="card
${x.featured&&!sold?"featured":""}
${sold?"sold":""}"
>

${
sold
?
'<span class="badge b-sold">🔴 SOLD</span>'
:
(
x.featured
?
'<span class="badge b-featured">⭐ Featured</span>'
:
""
)
}

${
imgs
?
`<div class="gallery">${imgs}</div>`
:
""
}

<h2>
${esc(x.title)}
</h2>

<div class="price">
Rs. ${Number(x.price||0).toLocaleString()}
</div>

<p>
📍 ${esc(x.city)}
&nbsp;
🗂️ ${esc(x.category)}
</p>

<p>
${esc(x.description)}
</p>

<p class="small">
📞 ${esc(x.phone)}
</p>

<div class="row">

<a
href="tel:${esc(x.phone)}">
<button class="blue">
📞 Call
</button>
</a>

<a
href="${wa(x.phone)}"
target="_blank">
<button class="green">
💬 WhatsApp
</button>
</a>

${
!mine&&!sold&&user
?
`
<button
class="dark"
onclick=
"openChat(
'${x.id}',
'${esc(x.userId)}',
'${esc(x.title)}'
)">
💬 Chat
</button>
`
:
""
}

${
mine
?
`
<button
class="red"
onclick=
"deleteMine('${x.id}')">
🗑️ Delete
</button>

<button
class="${sold?"green":"red"}"
onclick=
"setSold('${x.id}',${!sold})">
${sold?"🟢 Available":"🔴 Sold"}
</button>
`
:
""
}

</div>

</div>

`;

});


}catch(x){

box.innerHTML=
`
<div class="card">
❌ ${esc(x.message)}
</div>
`;

}

};


/* OWNER */

async function own(id){

if(!user)
return false;

const s=
await getDoc(
doc(db,"ads",id)
);

return(
s.exists() &&
s.data().userId===user.uid
);

}


/* DELETE */

window.deleteMine=
async id=>{

if(!(await own(id))){

alert(
"⛔ صرف مالک اپنا اشتہار delete کر سکتا ہے"
);

return;

}


if(!confirm(
"Delete کریں؟"
))
return;


try{

await deleteDoc(
doc(db,"ads",id)
);

loadAds();

alert(
"🗑️ Delete ہوگیا"
);

}catch(x){

alert(
"❌ "+x.message
);

}

};


/* SOLD */

window.setSold=
async(id,v)=>{

if(!(await own(id))){

alert(
"⛔ صرف مالک status بدل سکتا ہے"
);

return;

}


try{

await updateDoc(
doc(db,"ads",id),
{
sold:v
}
);

loadAds();

}catch(x){

alert(
"❌ "+x.message
);

}

};


/* CHAT */

window.openChat=
async(
adId,
sellerId,
title
)=>{

if(!user){

alert(
"Login کریں"
);

return;

}


if(user.uid===sellerId)
return;


const chatId=
[
user.uid,
sellerId,
adId
]
.sort()
.join("_");


activeChat={
id:chatId,
sellerId,
adId
};


await setDoc(
doc(db,"chats",chatId),
{

participants:
[
user.uid,
sellerId
],

buyerId:
user.uid,

sellerId,

adId,

updatedAt:
serverTimestamp()

},

{
merge:true
}
);


$("chatTitle")
.textContent=
"💬 Chat — "+title;


$("chatPanel")
.classList
.remove("hidden");


if(unsub)
unsub();


const q=
query(
collection(
db,
"chats",
chatId,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


unsub=
onSnapshot(
q,
s=>{

const b=
$("chatMessages");

b.innerHTML="";


s.forEach(
d=>{

const m=d.data();

const mine=
m.senderId===user.uid;


b.innerHTML+=
`
<div
class="msg
${mine?"mine":"theirs"}">

${esc(m.text)}

<div class="small">
${mine?"آپ":esc(m.senderEmail||"")}
</div>

</div>
`;

});


b.scrollTop=
b.scrollHeight;

},

e=>{

$("chatMessages")
.textContent=
"❌ Chat permission: "+
e.message;

}

);

};


/* SEND */

window.sendMessage=
async()=>{

if(!user||!activeChat)
return;


const t=
$("chatInput")
.value
.trim();


if(!t)
return;


try{

await addDoc(
collection(
db,
"chats",
activeChat.id,
"messages"
),
{

text:t,

senderId:
user.uid,

senderEmail:
user.email,

participants:
[
user.uid,
activeChat.sellerId
],

adId:
activeChat.adId,

createdAt:
serverTimestamp()

}
);


$("chatInput").value="";


}catch(x){

alert(
"❌ "+x.message
);

}

};


/* CLOSE CHAT */

window.closeChat=
()=>{

if(unsub){

unsub();

unsub=null;

}

activeChat=null;

$("chatPanel")
.classList
.add("hidden");

};


/* ADMIN */

window.openAdmin=
()=>{

if(!admin())
return;

$("adminPanel")
.classList
.remove("hidden");

loadAdmin();

};


async function loadAdmin(){

if(!admin())
return;


const s=
await getDocs(
collection(db,"ads")
);


let total=0;

let sold=0;

let featured=0;

let out="";


s.forEach(
d=>{

const x=d.data();

total++;

if(x.sold)
sold++;

if(x.featured)
featured++;


out+=
`

<div class="card">

<h3>
${esc(x.title)}
</h3>

<p>
👤 ${esc(x.userEmail||"")}
</p>

<p>
Rs. ${Number(x.price||0).toLocaleString()}
</p>

<p>
${x.sold?"🔴 SOLD":"🟢 Available"}
</p>

<button
class="orange"
onclick=
"feature(
'${d.id}',
${!!x.featured}
)">

⭐
${x.featured?
"Unfeature":
"Feature"}

</button>

<button
class="red"
onclick=
"adminDelete('${d.id}')">

🗑️ Delete

</button>

</div>

`;

});


$("adminStats")
.innerHTML=
`

<div class="stat">
📊 Total: ${total}
</div>

<div class="stat">
⭐ Featured: ${featured}
</div>

<div class="stat">
🔴 Sold: ${sold}
</div>

`;


$("adminAds")
.innerHTML=
out||
"کوئی اشتہار نہیں";

}


/* FEATURE */

window.feature=
async(id,v)=>{

if(!admin())
return;


await updateDoc(
doc(db,"ads",id),
{
featured:!v
}
);


loadAdmin();

loadAds();

};


/* ADMIN DELETE */

window.adminDelete=
async id=>{

if(
!admin() ||
!confirm("Delete کریں؟")
)
return;


await deleteDoc(
doc(db,"ads",id)
);


loadAdmin();

loadAds();

};


loadAds();

</script>

</body>
</html>
